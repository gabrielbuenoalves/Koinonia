<h1>Hello, {{ title() }}</h1>

<nav>
  <label>
    Papel
    <select [value]="papel()" (change)="guardarPapel($event)">
      <option value=""></option>
      <option value="Gestao">Gestao</option>
      <option value="Empregado">Empregado</option>
    </select>
  </label>
  <label>
    Funcionário da sessão
    <input [value]="funcionarioId()" (input)="guardarFuncionario($event)" />
  </label>
  @if (gestao()) {
    <a routerLink="/planejamento">Planejamento</a>
    <a routerLink="/fechamento">Fechamento</a>
  }
  <a routerLink="/ponto">Ponto</a>
</nav>

<router-outlet />
